name: Build ExecuTorch Android arm64-v8a

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_ABI: arm64-v8a
      ANDROID_PLATFORM: android-35
      ANDROID_NDK_VERSION: 27.2.12479018

    steps:
      - name: Checkout ExecuTorch
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Java
        run: |
          java -version
          javac -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cmake ninja

      - name: Configure Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"

      - name: Build ExecuTorch
        run: |
          mkdir -p build-android
          cd build-android

          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DANDROID_STL=c++_shared \
            -DEXECUTORCH_BUILD_ANDROID=ON

          cmake --build . --parallel

      - name: Find generated libraries
        run: |
          echo "=== Shared libraries ==="
          find . -type f -name "*.so" -print

          echo "=== Static libraries ==="
          find . -type f -name "*.a" -print

      - name: Package ARM64 libraries
        run: |
          mkdir -p artifacts/arm64-v8a

          find build-android \
            -type f \
            -name "*.so" \
            -exec cp {} artifacts/arm64-v8a/ \;

          find build-android \
            -type f \
            -name "*.a" \
            -exec cp {} artifacts/arm64-v8a/ \;

          ls -lah artifacts/arm64-v8a

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: executorch-android-arm64-v8a
          path: artifacts/arm64-v8a/
          if-no-files-found: error
