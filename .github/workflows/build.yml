name: Build ExecuTorch Android arm64-v8a

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-22.04

    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
      ANDROID_API: "24"

    steps:
      - name: Checkout ExecuTorch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cmake \
            unzip

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install packaging setuptools wheel

      - name: Install ExecuTorch
        run: |
          python -m pip install -e . --no-build-isolation

      - name: Show toolchain
        run: |
          echo "ANDROID_NDK=$ANDROID_NDK"
          $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++ \
            --version

      - name: Configure CMake
        run: |
          mkdir -p build-android
          cd build-android

          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK" \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install"

      - name: Build
        run: |
          cmake --build build-android \
            --parallel "$(nproc)"

      - name: Find libraries
        run: |
          echo "=== Shared libraries ==="
          find build-android -type f \
            \( -name "*.so" -o -name "*.a" \) \
            -print

      - name: Prepare artifacts
        run: |
          mkdir -p artifact/lib/arm64-v8a
          mkdir -p artifact/include

          find build-android -type f -name "*.so" \
            -exec cp {} artifact/lib/arm64-v8a/ \;

          if [ -d include ]; then
            cp -r include/* artifact/include/
          fi

          echo "=== Artifact ==="
          find artifact -type f -print

      - name: Upload ExecuTorch Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: executorch-android-arm64-v8a
          path: artifact/
          if-no-files-found: error
