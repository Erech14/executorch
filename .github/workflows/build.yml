name: Build ExecuTorch Android arm64-v8a

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android arm64-v8a
    runs-on: ubuntu-latest

    env:
      ANDROID_API: "35"
      ANDROID_NDK_VERSION: "27.2.12479018"
      ANDROID_ABI: "arm64-v8a"
      BUILD_TYPE: "Release"

    steps:
      # ------------------------------------------------------------
      # 1. Checkout ExecuTorch + ALL submodules
      # ------------------------------------------------------------
      - name: Checkout ExecuTorch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Java 17
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # 3. Python
      # ------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------------
      # 4. Python dependencies
      # ------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cmake ninja

      # ------------------------------------------------------------
      # 5. Android SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------------
      # 6. Android SDK + NDK
      # ------------------------------------------------------------
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ------------------------------------------------------------
      # 7. Environment
      # ------------------------------------------------------------
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          echo "Android SDK: ${ANDROID_SDK_ROOT}"
          echo "Android NDK: ${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          java -version
          python --version
          cmake --version
          ninja --version

      # ------------------------------------------------------------
      # 8. Verify submodules
      # ------------------------------------------------------------
      - name: Verify Git submodules
        run: |
          echo "=== Git submodules ==="
          git submodule status --recursive

          echo
          echo "=== third-party ==="
          ls -lah third-party/

          echo
          echo "=== JSON ==="
          test -f third-party/json/CMakeLists.txt
          ls -lah third-party/json

          echo
          echo "=== gflags ==="
          test -f third-party/gflags/CMakeLists.txt
          ls -lah third-party/gflags

          echo
          echo "=== FlatBuffers ==="
          test -d third-party/flatbuffers
          ls -lah third-party/flatbuffers

      # ------------------------------------------------------------
      # 9. Show Android toolchain
      # ------------------------------------------------------------
      - name: Verify Android NDK
        run: |
          echo "=== NDK ==="
          ls -lah "$ANDROID_NDK_HOME"

          echo
          echo "=== Clang ==="
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version

      # ------------------------------------------------------------
      # 10. Configure CMake
      # ------------------------------------------------------------
      - name: Configure CMake
        run: |
          rm -rf build-android

          cmake \
            -S . \
            -B build-android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_shared

      # ------------------------------------------------------------
      # 11. Build
      # ------------------------------------------------------------
      - name: Build ExecuTorch
        run: |
          cmake \
            --build build-android \
            --parallel "$(nproc)"

      # ------------------------------------------------------------
      # 12. Find generated libraries
      # ------------------------------------------------------------
      - name: Find libraries
        run: |
          echo "=== Shared libraries ==="

          find build-android \
            -type f \
            -name "*.so" \
            -print

          echo
          echo "=== Static libraries ==="

          find build-android \
            -type f \
            -name "*.a" \
            -print

      # ------------------------------------------------------------
      # 13. Verify architecture
      # ------------------------------------------------------------
      - name: Verify ARM64 libraries
        run: |
          mkdir -p artifacts

          find build-android \
            -type f \
            -name "*.so" \
            -exec cp {} artifacts/ \;

          echo "=== Libraries ==="
          ls -lah artifacts/

          echo
          echo "=== Architecture ==="

          for lib in artifacts/*.so; do
            echo
            echo ">>> $lib"
            file "$lib"
          done

          echo
          echo "Expected architecture: ARM aarch64"

          if ls artifacts/*.so >/dev/null 2>&1; then
            for lib in artifacts/*.so; do
              file "$lib" | grep -E "ARM aarch64|ARM64|AArch64" || {
                echo "ERROR: $lib is not ARM64"
                exit 1
              }
            done
          else
            echo "ERROR: No .so files were produced"
            exit 1
          fi

      # ------------------------------------------------------------
      # 14. Create archive
      # ------------------------------------------------------------
      - name: Create archive
        run: |
          tar -czf \
            executorch-android-${ANDROID_ABI}.tar.gz \
            -C artifacts .

          echo "=== Archive ==="
          ls -lh executorch-android-${ANDROID_ABI}.tar.gz

      # ------------------------------------------------------------
      # 15. Upload .so files
      # ------------------------------------------------------------
      - name: Upload Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: executorch-android-${{ env.ANDROID_ABI }}
          path: artifacts/*.so
          if-no-files-found: error

      # ------------------------------------------------------------
      # 16. Upload complete archive
      # ------------------------------------------------------------
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: executorch-android-${{ env.ANDROID_ABI }}-archive
          path: executorch-android-${{ env.ANDROID_ABI }}.tar.gz
          if-no-files-found: error
